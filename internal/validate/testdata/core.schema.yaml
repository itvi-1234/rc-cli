# A made-up core profile schema with the same structure as the real one, so that the tests do not
# depend on which version of the core schema exists. The real schema is embedded at build time.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.test/schemas/core-profile.schema.yaml
x-runtimeconditions-version: dummy
type: object
additionalProperties: false
required: [apiVersion, kind, metadata, workload, extensions, conditions]
properties:
  apiVersion: {const: runtimeconditions.io/v1alpha1}
  kind: {const: RuntimeConditionsProfile}
  metadata:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: {type: string, minLength: 1}
      labels: {type: object, additionalProperties: {type: string}}
  workload:
    type: object
    additionalProperties: false
    required: [uri]
    properties:
      uri: {type: string, minLength: 1}
      version: {type: string, minLength: 1}
  extensions:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  conditions:
    type: array
    items:
      type: object
      required: [kind, interface]
      properties:
        name: {type: string, minLength: 1}
        optional: {type: boolean}
        kind: {type: string, minLength: 1}
        extension: {type: string, minLength: 1}
        interface:
          type: object
          required: [type]
          properties:
            type: {type: string, minLength: 1}
          additionalProperties: true
      additionalProperties: true
allOf:
- if:
    properties: {conditions: {type: array, minItems: 1}}
    required: [conditions]
  then:
    properties: {extensions: {minItems: 1}}
    required: [extensions]
